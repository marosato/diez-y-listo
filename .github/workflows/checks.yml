name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test.cjs
      - run: node progression.test.cjs
      - run: node backup.test.cjs
      - run: node lifecycle.test.cjs
      - run: node platform.test.cjs
      - run: node i18n.test.cjs
      - run: node build.cjs web
      - run: node build.cjs crazygames
